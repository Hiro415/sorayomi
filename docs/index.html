<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宙よみ Sorayomi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      background: #0d0d1a;
      color: #e8e4f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    h1 { font-size: 32px; font-weight: 700; color: #f0eaff; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #9b87c4; margin-bottom: 48px; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    nav a {
      display: inline-block;
      padding: 12px 24px;
      background: #1a1830;
      color: #c4bdd8;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      transition: background 0.2s;
    }
    nav a:hover { background: #252040; color: #f0eaff; }
    footer { margin-top: 64px; font-size: 12px; color: #5a5270; }
  </style>
</head>
<body>
  <h1>宙よみ</h1>
  <p class="subtitle">Sorayomi — Fortune Telling App</p>
  <nav>
    <a href="privacy/">プライバシーポリシー</a>
    <a href="terms/">利用規約</a>
  </nav>
  <footer>&copy; 2026 Sorayomi. All rights reserved.</footer>
</body>
</html>
